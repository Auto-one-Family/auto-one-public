[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Xiao-optimierte Build-Flags
build_flags = 
    ; Debug & Logging (reduziert für Speicher)
    -DCORE_DEBUG_LEVEL=2
    ; Disable ANSI color codes (causes issues in most Serial Monitors)
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    
    ; KERNEL-FEATURES BEIBEHALTEN
    -DDYNAMIC_LIBRARY_SUPPORT=1
    -DHIERARCHICAL_ZONES=1
    -DOTA_LIBRARY_ENABLED=1
    -DSAFE_MODE_PROTECTION=1
    -DZONE_MASTER_ENABLED=1
    
    ; THREAD-SAFETY (Phase 6+) - Aktiviert Mutex-Schutz in StorageManager
    -DCONFIG_ENABLE_THREAD_SAFETY
    
    ; SAFETY-RTOS M5.1: Xiao/Wokwi nutzen PubSubClient (kein ESP-IDF MQTT)
    -DMQTT_USE_PUBSUBCLIENT=1
    ; Xiao-spezifische Anpassungen
    -DXIAO_ESP32C3_MODE=1
    -DMAX_SENSORS=10
    -DMAX_ACTUATORS=6
    -DMAX_LIBRARY_SIZE=32768
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMQTT_KEEPALIVE=60
    -DMQTT_SOCKET_TIMEOUT=60
    -DWIFI_CONNECT_TIMEOUT=10000
    -DCONFIG_ESP32_WIFI_STATIC_RX_BUFFER_NUM=8
    '-DKAISER_FIRMWARE_VERSION_STRING="4.0.0"'

; Partitionierung für Xiao (4MB Flash)
; min_spiffs.csv: app slots 1.875MB (0x1E0000) statt default 1.25MB (0x140000),
; spiffs auf 128KB reduziert — reicht fuer MAX_LIBRARY_SIZE=32768.
; Grund: default.csv laeuft ueber (Firmware >1.31MB).
board_build.partitions = min_spiffs.csv
board_build.filesystem = spiffs

; Libraries (nur Basis-Libraries)
lib_deps = 
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^6.21.3
    arduino-libraries/NTPClient@^3.2.1
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    WebServer
    DNSServer

monitor_filters =
    esp32_exception_decoder
    time
    ; colorize removed - causes ANSI escape code issues in Serial Monitor
    ; debug removed - causes fragmented [RX:'...'] output that's hard to read
    log2file
    default
    send_on_enter

; =============================================================================
; ESP32 DEV ENVIRONMENT - Entwicklungs-Board
; =============================================================================

[env:esp32_dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.offset_address = 0x20000

; ESP32 Dev Build-Flags
build_flags = 
    ; Debug & Logging (WARNING-Level fuer ESP32 Dev, war 2=INFO/3=VERBOSE — spart ~21KB Flash ggue. Level 3)
    ; AUT-539 merge: Level 2→1 um merged binary <100% zu halten (war 100.1% nach Merge aller Branches)
    -DCORE_DEBUG_LEVEL=1
    ; Disable ANSI color codes (causes issues in most Serial Monitors)
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    
    ; KERNEL-FEATURES BEIBEHALTEN
    -DDYNAMIC_LIBRARY_SUPPORT=1
    -DHIERARCHICAL_ZONES=1
    -DOTA_LIBRARY_ENABLED=1
    -DSAFE_MODE_PROTECTION=1
    -DZONE_MASTER_ENABLED=1
    
    ; THREAD-SAFETY (Phase 6+) - Aktiviert Mutex-Schutz in StorageManager
    -DCONFIG_ENABLE_THREAD_SAFETY

    ; SAFETY-RTOS M5.1: ESP-IDF MQTT ist jetzt der Default (kein Flag noetig).
    ; PubSubClient-Pfad erfordert explizit -DMQTT_USE_PUBSUBCLIENT=1 (seeed/wokwi).
    ; NOTE: Core-Pinning fuer MQTT-Task (Core 0) via sdkconfig — nicht via -D,
    ;       da CONFIG_MQTT_TASK_CORE_SELECTION_ENABLED ein Kconfig-Flag ist und
    ;       -D-Ueberschreibung mit sdkconfig.h Konflikte erzeugt.

    ; ESP32 Dev-spezifische Anpassungen
    -DESP32_DEV_MODE=1
    ; AUT-134/AUT-121: split verbose heartbeat metrics into dedicated topic
    ; to keep core heartbeat payload below queue envelope during reconnect bursts.
    -DENABLE_METRICS_SPLIT=1
    -DMAX_SENSORS=18  ; AUT-714: reduced from 20 to fit DRAM (liquid_level + LittleFS overhead)
    -DMAX_ACTUATORS=12
    -DMAX_LIBRARY_SIZE=65536
    -DMQTT_MAX_PACKET_SIZE=2048
    -DMQTT_KEEPALIVE=60
    -DMQTT_SOCKET_TIMEOUT=60
    -DWIFI_CONNECT_TIMEOUT=10000
    ; WiFi RX buffer count: set via sdkconfig (Arduino-ESP32). Do not -D here — conflicts with sdkconfig.h and spams redefinition warnings.
    ; Firmware version (Provisioning, /status) — override: '-DKAISER_FIRMWARE_VERSION_STRING="x.y.z"'
    '-DKAISER_FIRMWARE_VERSION_STRING="4.0.0"'
    ; AUT-62: Emergency token default is fail-open (code #ifndef).
    ; Prod-Builds: esp32_prod sets -DEMERGENCY_TOKEN_REQUIRED=1

; Partitionierung für ESP32 Dev (Custom: 1.5MB app slots, 32KB NVS)
board_build.partitions = partitions_custom.csv
board_build.filesystem = littlefs  ; AUT-714: spool backend
; SAFETY-RTOS M2: MQTT-Task auf Core 0 pinnen (siehe sdkconfig.defaults)
; NOTE: With framework=arduino, sdkconfig.defaults does NOT rebuild libmqtt.a — OUTBOX stays 4096 B.
; Runtime check: [FIX2-VERIFY] IDF runtime outbox_size= in serial after CONNECTED.
board_build.sdkconfig_defaults = sdkconfig.defaults

; Libraries (erweiterte Auswahl für ESP32 Dev)
lib_deps =
    bblanchon/ArduinoJson@^6.21.3
    arduino-libraries/NTPClient@^3.2.1
    paulstoffregen/OneWire@^2.3.7
    milesburton/DallasTemperature@^3.11.0
    WebServer
    DNSServer
    adafruit/Adafruit Unified Sensor@^1.1.9
    adafruit/Adafruit BME280 Library@^2.2.2
    throwtheswitch/Unity@^2.6.0

monitor_filters =
    esp32_exception_decoder
    time
    ; colorize removed - causes ANSI escape code issues in Serial Monitor
    ; debug removed - causes fragmented [RX:'...'] output that's hard to read
    log2file
    default
    send_on_enter

; =============================================================================
; ESP32-S3 DevKitC-1 N8R8 — gleiche Firmware-Logik wie esp32_dev
; =============================================================================
; GPIO-Map: src/config/hardware/esp32_s3_devkit.h (ESP32_S3_DEVKIT_MODE)
; N8R8: qio_opi Pflicht — sonst PSRAM-Bootloop. Upload: usb_reset (CDC) oder BOOT+RESET.
; MQTT-Skalierung (AUT-494): sdkconfig.s3.defaults (OUTBOX 65536, LWIP 32768) merged mit sdkconfig.defaults
; Lokal: pio run -e esp32-s3-devkitc-1 -t upload --upload-port COM8

[env:esp32-s3-devkitc-1]
extends = env:esp32_dev
board = esp32-s3-devkitc-1
framework = arduino

; N8R8: Quad-IO Flash + Octal PSRAM (fehlendes memory_type = Reset-Loop)
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv
board_build.sdkconfig_defaults = sdkconfig.defaults, sdkconfig.s3.defaults
; Nicht esp32_dev 0x20000 (WROOM custom layout) — Standard 8MB-Tabelle
board_upload.offset_address = 0x10000

build_flags =
    ${env:esp32_dev.build_flags}
    -DESP32_S3_DEVKIT_MODE=1
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; AUT-494: S3 OUTBOX macro for [FIX2-VERIFY] log (sdkconfig.s3.defaults = canonical IDF layer)
    -DCONFIG_MQTT_OUTBOX_SIZE_BYTES=65536

upload_speed = 921600
upload_protocol = esptool
upload_flags =
    --before=usb_reset
    --after=hard_reset
    --chip=esp32s3

monitor_speed = 115200
; USB-JTAG/CDC: DTR/RTS=0 verhindert Download-Mode beim Monitor-Start (Windows)
monitor_dtr = 0
monitor_rts = 0

; Alias fuer fruehere Experimente / Skripte
[env:esp32_s3_dev]
extends = env:esp32-s3-devkitc-1

; =============================================================================
; ESP32 PROD ENVIRONMENT - Produktions-Build (fail-closed Emergency)
; =============================================================================
; AUT-62: Extends esp32_dev with EMERGENCY_TOKEN_REQUIRED=1.
; Emergency commands without a provisioned NVS token are REJECTED.
; Token provisioning: MQTT command set_emergency_token or NVS pre-flash.
; See .claude/reference/security/PRODUCTION_CHECKLIST.md

[env:esp32_prod]
extends = env:esp32_dev
build_flags =
    ${env:esp32_dev.build_flags}
    -DEMERGENCY_TOKEN_REQUIRED=1

; =============================================================================
; FUNKTURM TEST FLASH — WiFi/MQTT aus Umgebungsvariablen, einmalig ins NVS schreiben
; =============================================================================
; Passwort niemals ins Repo: nur export beim Build.
;   export FUNKTURM_WIFI_PASSWORD='...'
;   pio run -e esp32_funkturm -t upload --upload-port /dev/ttyUSB0
; Optional: FUNKTURM_WIFI_SSID (default Funkturm), FUNKTURM_MQTT_HOST (default 192.168.178.60),
;           FUNKTURM_MQTT_PORT (default 1883)
; Siehe scripts/esp/funkturm_wifi_flags.py

[env:esp32_funkturm]
extends = env:esp32_dev
extra_scripts = pre:scripts/esp/funkturm_wifi_flags.py

; =============================================================================
; NVS SECRETS FLASH — Flash NVS partition with per-environment MQTT credentials
; =============================================================================
; AUT-764: Generates nvs_secrets.{ENV}.bin from CSV and flashes to 0x9000.
; Prerequisite: pip install esp-idf-nvs-partition-gen
; See El Trabajante/secrets/README.md for setup instructions.
;
; Usage (generate + flash):
;   NVS_ENV=dev-local UPLOAD_PORT=COM5 pio run -e flash_nvs -t flash_nvs
; Usage (generate only, no ESP connected):
;   NVS_ENV=dev-local pio run -e flash_nvs -t flash_nvs
; Directly via script (also works on Pi without PlatformIO):
;   python scripts/esp/flash_nvs.py --env dev-local [--port COM5]

[env:flash_nvs]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/esp/flash_nvs_hook.py

; =============================================================================
; WOKWI SIMULATION ENVIRONMENT
; =============================================================================
; Purpose: Test real ESP32 firmware in Wokwi virtual environment
;
; Usage:
;   Build:   pio run -e wokwi_simulation
;   Run:     wokwi-cli . --timeout 60000
;   CI:      wokwi-cli . --scenario tests/wokwi/scenarios/01-boot/boot_full.yaml
;
; Documentation: https://docs.wokwi.com/

[env:wokwi_simulation]
extends = env:esp32_dev
build_flags =
    ${env:esp32_dev.build_flags}
    ; Wokwi Simulation Mode
    -D WOKWI_SIMULATION=1
    ; Disable ANSI color codes for Wokwi (Serial Monitor doesn't support them)
    -DCONFIG_ARDUHAL_LOG_COLORS=0
    ; WiFi credentials for Wokwi (Wokwi-GUEST is open network)
    -D WOKWI_WIFI_SSID=\"Wokwi-GUEST\"
    -D WOKWI_WIFI_PASSWORD=\"\"
    ; MQTT broker via Wokwi Gateway (routes to localhost or CI service)
    ; Use host.wokwi.internal - Wokwi's special hostname for host machine
    ; Falls back to actual Windows IP if this doesn't work
    -D WOKWI_MQTT_HOST=\"host.wokwi.internal\"
    -D WOKWI_MQTT_PORT=1883
    ; Optional: Pre-configured ESP ID for reproducible tests
    ; Format must match server pattern: ESP_[A-F0-9]{8}
    -D WOKWI_ESP_ID=\"ESP_00000001\"
    ; Wokwi uses PubSubClient (Arduino), not ESP-IDF MQTT (no FreeRTOS task support in sim)
    -DMQTT_USE_PUBSUBCLIENT=1

; PubSubClient required for MQTT_USE_PUBSUBCLIENT=1 (not in esp32_dev lib_deps)
lib_deps =
    ${env:esp32_dev.lib_deps}
    knolleary/PubSubClient@^2.8

; Disable colorize filter for Wokwi (causes ANSI escape code issues)
; debug removed - causes fragmented [RX:'...'] output that's hard to read
monitor_filters =
    esp32_exception_decoder
    time
    log2file
    default
    send_on_enter

; =============================================================================
; WOKWI MULTI-DEVICE ENVIRONMENTS - For Parallel Testing
; =============================================================================
; Purpose: Multiple Wokwi ESPs with different IDs for multi-device scenarios
;
; Usage:
;   Build:   pio run -e wokwi_esp01|wokwi_esp02|wokwi_esp03
;   Run:     wokwi-cli . --timeout 0 --firmware .pio/build/wokwi_esp01/firmware.bin
;   CI:      Parallel test execution with different device IDs
;
; Note: Each environment uses same codebase, only ESP ID differs

[env:wokwi_esp01]
extends = env:wokwi_simulation
build_flags =
    ${env:wokwi_simulation.build_flags}
    -D WOKWI_ESP_ID=\"ESP_00000001\"

[env:wokwi_esp02]
extends = env:wokwi_simulation
build_flags =
    ${env:wokwi_simulation.build_flags}
    -D WOKWI_ESP_ID=\"ESP_00000002\"

[env:wokwi_esp03]
extends = env:wokwi_simulation
build_flags =
    ${env:wokwi_simulation.build_flags}
    -D WOKWI_ESP_ID=\"ESP_00000003\"

; =============================================================================
; NATIVE TEST ENVIRONMENT - x86_64 Host (KEINE Hardware)
; =============================================================================
; Purpose: Unit tests für Pure-Logic-Module ohne Hardware-Dependencies
;
; Usage:
;   pio test -e native                    # Alle nativen Tests
;   pio test -e native -f test_topic_*    # Nur TopicBuilder
;   pio test -e native -v                 # Verbose
;
; Known Issues:
;   - Historische PlatformIO Linker-Probleme (dokumentiert in TEST_WORKFLOW.md)
;   - Git Bash hat Probleme mit pio test - verwende PowerShell oder CMD
;   - Native: gcc/g++ erforderlich (PATH oder MinGW-Pfade in scripts/set_native_toolchain.py)

[env:native]
platform = native
extra_scripts = pre:scripts/set_native_toolchain.py
build_flags =
    -std=c++17
    ; Test-Mode aktivieren
    -DNATIVE_TEST=1
    -DUNIT_TEST=1

    ; Disable Hardware
    -DESP_PLATFORM=0
    -DARDUINO=0

    ; Mock-Konfiguration
    -DMOCK_ARDUINO=1

    ; Konstanten für Tests
    -DMAX_SENSORS=20
    -DMAX_ACTUATORS=12
    -DMQTT_MAX_PACKET_SIZE=2048

    ; Include-Paths
    -I src/
    -I test/mocks/

; Test-Konfiguration
test_framework = unity
test_build_src = yes
build_src_filter =
    -<*>
    +<utils/topic_builder.cpp>
    +<drivers/gpio_manager.cpp>
    +<utils/logger.cpp>
test_ignore =
    esp32_hardware              ; Hardware-Tests überspringen
    integration
    _archive
    helpers
    mocks

; =============================================================================
; ESP32 HARDWARE TEST ENVIRONMENT - Unity auf ESP32 (optional)
; =============================================================================
; Purpose: Hardware-nahe Tests direkt auf ESP32 ausführen
;
; Usage:
;   pio test -e esp32dev_test -t upload    # Upload und run auf Hardware

[env:esp32dev_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_flags =
    ${env:esp32_dev.build_flags}
    -DUNIT_TEST=1
    -DESP32_HARDWARE_TEST=1

test_framework = unity
test_build_src = yes
test_ignore =
    unit/native_only
    _archive

lib_deps =
    ${env:esp32_dev.lib_deps}

; =============================================================================
; TEST ENVIRONMENT
; =============================================================================
; HINWEIS: Test-Kategorisierung erfolgt über PowerShell-Script, nicht über
; separate Environments. Siehe .claude/commands/esp-test-category.md
;
; Usage:
;   /esp-test-category infra        # Nur Infrastructure-Tests
;   /esp-test-category actuator     # Nur Actuator-Tests
;   /esp-test-category sensor       # Nur Sensor-Tests
;   /esp-test-category comm         # Nur Communication-Tests
;   /esp-test-category integration  # Nur Integration-Tests
;   /esp-test-category all          # Alle Kategorien sequentiell
;
; Das Script managed dynamisch welche Test-Dateien im test/ Ordner sind,
; um PlatformIO's Multiple-Definition-Problem zu umgehen.

